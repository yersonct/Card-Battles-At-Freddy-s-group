<script>
document.addEventListener('DOMContentLoaded', () => {
  // IDs de debug si faltan (opcional)
  if (!localStorage.getItem('partidaId')) localStorage.setItem('partidaId', '1');
  if (!localStorage.getItem('jugadorId')) localStorage.setItem('jugadorId', '1');

  // Init del juego: URL > localStorage
  const qs = new URLSearchParams(location.search);
  const partidaId = Number(qs.get('partidaId')) || Number(localStorage.getItem('partidaId'));
  const jugadorId = Number(qs.get('jugadorId'))  || Number(localStorage.getItem('jugadorId'));
  if (!partidaId || !jugadorId) { console.warn('Falta partidaId o jugadorId'); return; }

  window.game = new GameFlowController();
  window.game.init(partidaId, jugadorId);

  // Botones de acción
  document.querySelector('.tirar')?.addEventListener('click', () => {
    window.game?.cardSelection?.confirmarSeleccionCarta();
  });
  document.querySelector('.no-tirar')?.addEventListener('click', () => {
    window.game?.cardSelection?.deshabilitarSeleccion();
    alert('Has decidido no lanzar ahora. (Sigue el turno vigente)');
  });
});
</script>


  <script>
    (function () {
      const API_BASE = (window.API_CONFIG?.baseURL || 'http://localhost:7147/api').replace(/\/+$/, '');
      const PUBLIC_BASE = API_BASE.replace(/\/api$/i, '');
      const FRONT_IMG_BASE = '../img/foto';
      const IMG_FALLBACK = `${FRONT_IMG_BASE}/icono.png`;

      document.addEventListener('DOMContentLoaded', bootstrap);

      async function bootstrap() {
        const partidaId = Number(localStorage.getItem('partidaId')) || Number(getQS('partidaId'));
        if (!partidaId) return;

        const jugadores = await cargarJugadoresMax7(partidaId);
        renderSlots(jugadores);
      }

      async function cargarJugadoresMax7(pid) {
        try {
          const r = await fetch(`${API_BASE}/Jugador/partida/${pid}`);
          if (r.ok) return normalizar(await r.json()).slice(0, 7);
        } catch {}
        try {
          const r = await fetch(`${API_BASE}/Jugador`);
          if (r.ok) {
            const all = await r.json();
            return normalizar(all.filter(j => j.idPartida == pid)).slice(0, 7);
          }
        } catch {}
        return [];
      }

      function normalizar(arr) {
        return (arr || [])
          .map(j => ({
            id: j.id,
            nombre: j.nombre,
            avatar: j.avatar,
            posicionTurno: j.posicionTurno,
            active: j.active !== false
          }))
          .filter(j => j.active)
          .sort((a, b) => (a.posicionTurno ?? 9999) - (b.posicionTurno ?? 9999));
      }

      function renderSlots(jugadores) {
  const slots = document.querySelectorAll('.iconos-1, .iconos-2');
  slots.forEach((slot, idx) => {
    const j = jugadores[idx];
    if (!j) {
      slot.style.display = 'none';
      slot.style.backgroundImage = ''; // limpiar si no hay jugador
      return;
    }

    slot.style.display = 'block';

    const titulo = slot.querySelector('h4');
    if (titulo) titulo.textContent = `T${j.posicionTurno || idx + 1}`;

    // Poner nombre en input
    const input = slot.querySelector('input');
    if (input) input.value = j.nombre || `Jugador ${idx + 1}`;

    // Usar setAvatar para calcular la ruta de la imagen
    setBackground(slot, j.avatar, IMG_FALLBACK);
  });
}
function setBackground(slotEl, avatar, fallback) {
  const raw = String(avatar || '').trim();
  const baseName = raw.split(/[\\/]/).pop();
  if (!baseName) {
    slotEl.style.backgroundImage = `url(${fallback})`;
    return;
  }

  const dot = baseName.lastIndexOf('.');
  const name = dot > 0 ? baseName.slice(0, dot) : baseName;
  const ext  = dot > 0 ? baseName.slice(dot).toLowerCase() : '';

  const tryExts = [];
  if (ext) tryExts.push(ext);
  ['.jpg', '.jpeg', '.png', '.webp'].forEach(e => {
    if (e !== ext) tryExts.push(e);
  });

  const bust = `?v=${Date.now()}`;
  const candidates = [];
  for (const e of tryExts) {
    const fname = encodeURIComponent(name + e);
    candidates.push(`${FRONT_IMG_BASE}/${fname}${bust}`);
    candidates.push(`${PUBLIC_BASE}/img/foto/${fname}${bust}`);
  }

  let i = 0;
  const tryNext = () => {
    if (i >= candidates.length) {
      slotEl.style.backgroundImage = `url(${fallback})`;
      return;
    }
    const url = candidates[i++];
    const img = new Image();
    img.onload = () => slotEl.style.backgroundImage = `url(${url})`;
    img.onerror = tryNext;
    img.src = url;
  };
  tryNext();
}

       function setAvatar(imgEl, avatar, fallback) {
    const raw = String(avatar || '').trim();
    const baseName = raw.split(/[\\/]/).pop();
    if (!baseName) { imgEl.src = fallback; return; }

    const dot = baseName.lastIndexOf('.');
    const name = dot > 0 ? baseName.slice(0, dot) : baseName;
    const ext  = dot > 0 ? baseName.slice(dot).toLowerCase() : '';

    const tryExts = [];
    if (ext) tryExts.push(ext);
    ['.jpg','.jpeg','.png','.webp'].forEach(e => {
      if (e !== ext) tryExts.push(e);
    });

    const bust = `?v=${Date.now()}`;
    const candidates = [];
    for (const e of tryExts) {
      const fname = encodeURIComponent(name + e);
      candidates.push(`${FRONT_IMG_BASE}/${fname}${bust}`);
      candidates.push(`${PUBLIC_BASE}/img/foto/${fname}${bust}`);
    }

    let i = 0;
    const tryNext = () => {
      if (i >= candidates.length) { imgEl.src = fallback; return; }
      imgEl.src = candidates[i++];
      imgEl.onerror = tryNext;
    };
    tryNext();
  }

      function getQS(k) { return new URLSearchParams(location.search).get(k); }
    })();
  </script>
